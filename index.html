
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Esporotricose: Cartilha para Tutores">

    <title>Esporotricose: Cartilha para Tutores</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>

</head>

<body>

    <!-- CABEÇALHO -->

    <header class="cabecalho">

        <div class="marca">

            <span>Esporotricose</span>

            <small>Cartilha para Tutores</small>

        </div>

        <button id="tela-cheia"
            title="Tela cheia"
            aria-label="Alternar tela cheia">
            ⛶
        </button>

    </header>


    <!-- BARRA DE PROGRESSO -->

    <div class="progresso">

        <div id="barra-progresso"></div>

    </div>


    <!-- CARTILHA -->

    <main class="cartilha" id="cartilha">

        <!-- PÁGINA 01 -->

        <section class="pagina" id="pagina-01">

            <img
                src="imagens/pagina-01-capa.png"
                alt="Capa da cartilha de esporotricose">

        </section>


        <!-- PÁGINA 02 -->

        <section class="pagina" id="pagina-02">

            <img
                src="imagens/pagina-02-folha-rosto.png"
                alt="Folha de rosto">

        </section>


        <!-- PÁGINA 03 -->

        <section class="pagina" id="pagina-03">

            <img
                src="imagens/pagina-03-o-que-e-esporotricose.png"
                alt="O que é esporotricose?">

        </section>


        <!-- PÁGINA 04 -->

        <section class="pagina" id="pagina-04">

            <img
                src="imagens/pagina-04-transmissao.png"
                alt="Transmissão da esporotricose">

        </section>


        <!-- PÁGINA 05 -->

        <section class="pagina" id="pagina-05">

            <img
                src="imagens/pagina-05-sintomas.png"
                alt="O que a doença causa?">

        </section>


        <!-- PÁGINA 06 -->

        <section class="pagina" id="pagina-06">

            <img
                src="imagens/pagina-06-notificacao.png"
                alt="Notificação compulsória">

        </section>


        <!-- PÁGINA 07 -->

        <section class="pagina" id="pagina-07">

            <img
                src="imagens/pagina-07-saude-unica.png"
                alt="Saúde Única">

        </section>


        <!-- PÁGINA 08 -->

        <section class="pagina" id="pagina-08">

            <img
                src="imagens/pagina-08-historia.png"
                alt="História da doença">

        </section>


        <!-- PÁGINA 09 -->

        <section class="pagina" id="pagina-09">

            <img
                src="imagens/pagina-09-dados-mooca.png"
                alt="Dados da região da Mooca">

        </section>


        <!-- PÁGINA 10 -->

        <section class="pagina" id="pagina-10">

            <img
                src="imagens/pagina-10-casos-humanos.png"
                alt="Casos humanos">

        </section>


        <!-- PÁGINA 11 -->

        <section class="pagina" id="pagina-11">

            <img
                src="imagens/pagina-11-tratamento-animal.png"
                alt="Tratamento animal">

        </section>


        <!-- PÁGINA 12 -->

        <section class="pagina" id="pagina-12">

            <img
                src="imagens/pagina-12-tratamento-humano.png"
                alt="Tratamento humano">

        </section>


        <!-- PÁGINA 13 -->

        <section class="pagina" id="pagina-13">

            <img
                src="imagens/pagina-13-fluxograma.png"
                alt="Fluxograma de atendimento">

        </section>


        <!-- PÁGINA 14 -->

        <section class="pagina" id="pagina-14">

            <img
                src="imagens/pagina-14-sus.png"
                alt="Atendimento pelo SUS">

        </section>


        <!-- PÁGINA 15 -->

        <section class="pagina" id="pagina-15">

            <img
                src="imagens/pagina-15-orientacoes.png"
                alt="Orientações aos tutores">

        </section>


        <!-- PÁGINA 16 -->

        <section class="pagina" id="pagina-16">

            <img
                src="imagens/pagina-16-muito-importante.png"
                alt="Orientações importantes">

        </section>


        <!-- PÁGINA 17 -->

        <section class="pagina" id="pagina-17">

            <img
                src="imagens/pagina-17-hospitais-veterinarios.png"
                alt="Hospitais veterinários públicos">

        </section>


        <!-- PÁGINA 18 -->

        <section class="pagina" id="pagina-18">

            <img
                src="imagens/pagina-18-atendimento-mooca.png"
                alt="Atendimento na região da Mooca">

        </section>


        <!-- PÁGINA 19 -->

        <section class="pagina" id="pagina-19">

            <img
                src="imagens/pagina-19-referencias.png"
                alt="Referências bibliográficas">

        </section>

    </main>


    <!-- BARRA DE CONTROLES -->

    <footer class="controles">

        <div class="contador">

            <span>Página</span>

            <span id="pagina-atual">01</span>

            <span>/</span>

            <span id="total-paginas">19</span>

        </div>

        <div class="controles-zoom">

            <button id="diminuir-zoom"
                title="Diminuir zoom"
                aria-label="Diminuir zoom">
                −
            </button>

            <button id="resetar-zoom"
                title="Restaurar zoom">
                100%
            </button>

            <button id="aumentar-zoom"
                title="Aumentar zoom"
                aria-label="Aumentar zoom">
                +
            </button>

        </div>

    </footer>


    <!-- BOTÃO VOLTAR AO TOPO -->

    <button id="voltar-topo"
        title="Voltar ao topo"
        aria-label="Voltar ao topo">

        ↑

    </button>

</body>

</html>
